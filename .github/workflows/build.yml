name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish WPF application
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Show SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore NodeBB.SSHManager.sln
      - name: Build
        run: dotnet build NodeBB.SSHManager.sln --configuration Release --no-restore
      - name: Run automated tests
        run: dotnet test NodeBB.SSHManager.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish self-contained Windows x64
        run: dotnet publish src/NodeBB.SSHManager.App/NodeBB.SSHManager.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PlatformTarget=x64 -p:PublishSingleFile=false --output artifacts/win-x64
      - name: Verify WPF native runtime architecture
        shell: pwsh
        run: |
          $dll = Get-ChildItem "artifacts/win-x64" -Filter "DirectWriteForwarder.dll" -Recurse | Select-Object -First 1
          if (-not $dll) { throw "DirectWriteForwarder.dll is missing from the published WPF output." }
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          if ($bytes.Length -lt 64) { throw "DirectWriteForwarder.dll is unexpectedly small." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw "Invalid PE header in DirectWriteForwarder.dll." }
          $signature = [System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($signature -ne ("PE" + [char]0) -or $machine -ne 0x8664) {
            throw ("DirectWriteForwarder.dll is not a valid x64 PE image. Signature={0}; Machine=0x{1:X4}" -f $signature, $machine)
          }
          Write-Host ("Verified x64 WPF native component: {0}" -f $dll.FullName)
      - name: Smoke-test portable application startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "artifacts/win-x64/NodeBB.SSHManager.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--startup-smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Portable application startup smoke test failed with exit code $($process.ExitCode)."
          }
          Write-Host "Portable application created and displayed its main WPF window successfully."
      - name: Create portable Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/win-x64/*" -DestinationPath "artifacts/NodeBB-SSH-Manager-Portable-win-x64.zip" -CompressionLevel Optimal
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found after installation." }
          $project = [xml](Get-Content "src/NodeBB.SSHManager.App/NodeBB.SSHManager.App.csproj")
          $version = $project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Application version is missing from the project file." }
          & $compiler "/DAppVersion=$version" "installer/NodeBB-SSH-Manager.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path "artifacts/NodeBB-SSH-Manager-Setup-win-x64.exe")) { throw "The Windows installer was not created." }
      - name: Smoke-test installed application startup
        shell: pwsh
        run: |
          $setup = (Resolve-Path "artifacts/NodeBB-SSH-Manager-Setup-win-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "NodeBB-SSH-Manager-SmokeTest"
          $installer = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$installDir"
          ) -PassThru -Wait
          if ($installer.ExitCode -ne 0) {
            throw "Silent installer test failed with exit code $($installer.ExitCode)."
          }
          $installedExe = Join-Path $installDir "NodeBB.SSHManager.exe"
          if (-not (Test-Path $installedExe)) { throw "The installer did not place the application executable in the selected directory." }
          $application = Start-Process -FilePath $installedExe -ArgumentList "--startup-smoke-test" -PassThru -Wait
          if ($application.ExitCode -ne 0) {
            throw "Installed application startup smoke test failed with exit code $($application.ExitCode)."
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $remove = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
            if ($remove.ExitCode -ne 0) { throw "Smoke-test cleanup uninstall failed with exit code $($remove.ExitCode)." }
          }
          Write-Host "Installer installed, launched and uninstalled the application successfully."
      - name: Create release checksum manifest
        shell: pwsh
        run: |
          $targets = @(
            "artifacts/NodeBB-SSH-Manager-Setup-win-x64.exe",
            "artifacts/NodeBB-SSH-Manager-Portable-win-x64.zip"
          )
          $lines = foreach ($file in $targets) {
            if (-not (Test-Path $file)) { throw "Release package is missing: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content "artifacts/SHA256SUMS.txt" -Encoding ascii
      - name: Validate release package set
        shell: pwsh
        run: |
          $required = @(
            "artifacts/NodeBB-SSH-Manager-Setup-win-x64.exe",
            "artifacts/NodeBB-SSH-Manager-Portable-win-x64.zip",
            "artifacts/SHA256SUMS.txt"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Required release file is missing: $file" }
            $item = Get-Item $file
            if ($item.Length -le 0) { throw "Required release file is empty: $file" }
            Write-Host "$($item.Name): $($item.Length) bytes"
          }
          Get-Content "artifacts/SHA256SUMS.txt"
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: NodeBB-SSH-Manager-Portable-win-x64
          path: artifacts/NodeBB-SSH-Manager-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NodeBB-SSH-Manager-Setup-win-x64
          path: artifacts/NodeBB-SSH-Manager-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: NodeBB-SSH-Manager-Checksums
          path: artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NodeBB-SSH-Manager-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 14
